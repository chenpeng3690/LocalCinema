org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
# 容器只有 8GB 内存，R8 默认按 CPU 核数并发，容易把守护进程 OOM 掉，限成 2 个 worker。
# android.r8.maxWorkers 被 AGP 标记为 experimental（历史遗留属性名，没有 android.experimental. 前缀），
# 每次配置都会刷一行 "The option setting 'android.r8.maxWorkers=2' is experimental."。
# android.suppressUnsupportedOptionWarnings 可以按属性名静音这类警告，但它自己也属于 experimental，
# 所以要把自己的名字也写进列表里，否则只是换一条警告继续刷屏。
android.r8.maxWorkers=2
android.suppressUnsupportedOptionWarnings=android.r8.maxWorkers,android.suppressUnsupportedOptionWarnings
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
